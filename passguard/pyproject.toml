[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passguard"
version = "1.0.0"
description = "A password strength analyzer with entropy scoring, breach checks, and reuse prevention."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jual Coco" }]
keywords = ["password", "security", "entropy", "cryptography", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
web = ["flask>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
passguard = "passguard.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/passguard"
Issues = "https://github.com/your-username/passguard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
passguard = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
